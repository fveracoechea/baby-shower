    <rect x="21" y="24" width="978" height="466" rx="3" fill="url(#paper)" filter="url(#grain)"/>
    <path d="M56 87 H966" stroke="#8f7b55" stroke-width="2" opacity="0.45"/>
    <path d="M650 87 V444" stroke="#8f7b55" stroke-width="2" opacity="0.34"/>

    <g transform="translate(67 109)">
      <text x="0" y="0" fill="#8b1717" font-family="'Courier New', monospace" font-size="18" font-weight="700" letter-spacing="5">EXPEDIENTE 10.10.26</text>
      <text x="0" y="86" fill="#1c1917" font-family="Georgia, serif" font-size="66" font-weight="700">¿Niña o niño?</text>
      <text x="2" y="132" fill="#51483b" font-family="'Courier New', monospace" font-size="24" letter-spacing="3">GIRL OR BOY?</text>
      <path d="M0 166 H520" stroke="#1c1917" stroke-width="3"/>
      <text x="0" y="220" fill="#1c1917" font-family="Georgia, serif" font-size="39" font-style="italic">Nancy &amp; Francisco</text>
      <text x="2" y="272" fill="#51483b" font-family="'Courier New', monospace" font-size="20" font-weight="700" letter-spacing="2">BABY SHOWER + GENDER REVEAL</text>
      <text x="28" y="323" fill="#1c1917" font-family="'Courier New', monospace" font-size="22">OCTOBER 10, 2026  •  HOSCHTON, GA</text>
    </g>

