      <text x="14" y="38" fill="#9f1d1d" font-family="'Courier New', monospace" font-size="20" font-weight="700" letter-spacing="2">TOP SECRET</text>
    </g>
  </g>

  <g transform="translate(18 485) scale(0.72) rotate(8 110 78)" filter="url(#smallShadow)">
    <rect width="225" height="150" fill="url(#envelope)"/>
    <path d="M0 0 L112 85 L225 0" fill="#efbf46"/>
    <path d="M0 150 L91 65 Q112 45 134 65 L225 150" fill="#eab037"/>
    <circle cx="112" cy="84" r="31" fill="#941b1b" stroke="#671111" stroke-width="5"/>
    <text x="112" y="97" text-anchor="middle" fill="#f7dda0" font-family="Georgia, serif" font-size="39" font-weight="700">?</text>
