      <ellipse cx="124" cy="127" rx="88" ry="75" fill="#4b4a47"/>
      <ellipse cx="130" cy="129" rx="58" ry="48" fill="#777671"/>
      <path d="M87 141 C105 101 136 94 157 115 C178 135 166 174 133 180 C108 184 86 168 87 141 Z" fill="#d2d0c9"/>
      <circle cx="124" cy="133" r="13" fill="#f1efe7"/>
      <path d="M94 104 Q128 76 170 102" fill="none" stroke="#b9b7b0" stroke-width="6" stroke-linecap="round"/>
      <text x="22" y="281" fill="#33302b" font-family="'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="2">EVIDENCE 01</text>
