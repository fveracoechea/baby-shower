<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="lamp" cx="50%" cy="0%" r="78%">
      <stop offset="0" stop-color="#5e4b23"/>
      <stop offset="0.48" stop-color="#211b12"/>
      <stop offset="1" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7d7"/>
      <stop offset="1" stop-color="#f4d57b"/>
    </linearGradient>
    <linearGradient id="envelope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7cc58"/>
      <stop offset="1" stop-color="#d89a22"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.62"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="24" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.09"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#lamp)"/>
  <path d="M-20 530 C280 450 470 520 750 422 S1070 320 1230 360" fill="none" stroke="#8c1717" stroke-width="4" opacity="0.6"/>
